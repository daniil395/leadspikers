<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B2C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="0" fill="#FFFFFF"/>
  
  <!-- Логотипы платформ (компактнее) -->
  <g transform="translate(256, 90)">
    <!-- Gmail -->
    <circle cx="-180" cy="0" r="28" fill="#EA4335"/>
    <text x="-180" y="8" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="900">G</text>
    
    <!-- Telegram -->
    <circle cx="-60" cy="0" r="28" fill="#0088CC"/>
    <text x="-60" y="8" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="900">✈</text>
    
    <!-- LinkedIn -->
    <circle cx="60" cy="0" r="28" fill="#0077B5"/>
    <text x="60" y="8" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="900">in</text>
    
    <!-- Outlook -->
    <circle cx="180" cy="0" r="28" fill="#0078D4"/>
    <text x="180" y="8" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="900">@</text>
  </g>
  
  <!-- Название Leadspikers -->
  <text x="256" y="240" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="76" 
        font-weight="900" 
        fill="#0A0A0A" 
        text-anchor="middle" 
        letter-spacing="-0.03em">Leadspikers</text>
  
  <!-- Оранжевая линия -->
  <line x1="110" y1="260" x2="402" y2="260" 
        stroke="url(#orangeGradient)" 
        stroke-width="7" 
        stroke-linecap="round"/>
  
  <!-- Текст описания (одной строкой) -->
  <text x="256" y="320" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="26" 
        font-weight="600" 
        fill="#525252" 
        text-anchor="middle" 
        letter-spacing="-0.01em">Аутрич, который работает:</text>
  
  <text x="256" y="360" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="26" 
        font-weight="600" 
        fill="#525252" 
        text-anchor="middle" 
        letter-spacing="-0.01em">эффективное привлечение В2В-клиентов</text>
</svg>
