<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B2C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="100" fill="#FFFFFF"/>
  
  <!-- Скругленный квадрат с градиентом (современный B2B стиль) -->
  <rect x="86" y="86" width="340" height="340" rx="80" fill="url(#orangeGradient)"/>
  
  <!-- Буквы LS -->
  <text x="256" y="320" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="220" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-0.12em"
        style="text-rendering: optimizeLegibility;">LS</text>
</svg>
