<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF5A15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B2C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="120" fill="#FFFFFF"/>
  
  <!-- Круг с градиентом -->
  <circle cx="256" cy="256" r="195" fill="url(#orangeGradient)"/>
  
  <!-- Внутренний круг для глубины -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.15"/>
  
  <!-- Буквы LS - премиум стиль -->
  <text x="256" y="310" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="200" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-0.1em"
        filter="url(#glow)"
        style="text-rendering: optimizeLegibility;
               -webkit-font-smoothing: antialiased;
               -moz-osx-font-smoothing: grayscale;">LS</text>
</svg>
