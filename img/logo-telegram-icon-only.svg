<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B2C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  
  <!-- Иконка молнии в градиентном круге с тенью -->
  <circle cx="256" cy="256" r="200" fill="url(#orangeGradient)" filter="url(#shadow)"/>
  
  <!-- Молния -->
  <path d="M 256 120 L 256 220 L 320 220 L 280 320 L 256 280 L 200 280 L 256 120 Z" 
        fill="#FFFFFF" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linejoin="round"
        stroke-linecap="round"/>
</svg>
