<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B2C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="16" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  
  <!-- Круг с градиентом и тенью -->
  <circle cx="256" cy="256" r="190" fill="url(#orangeGradient)" filter="url(#shadow)"/>
  
  <!-- Буквы LS - профессиональный шрифт -->
  <text x="256" y="310" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="200" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-0.1em"
        style="text-rendering: optimizeLegibility;">LS</text>
  
  <!-- Акцентная линия под буквами (опционально) -->
  <line x1="180" y1="340" x2="332" y2="340" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round"
        opacity="0.6"/>
</svg>
