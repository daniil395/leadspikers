<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B2C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  
  <!-- Иконка молнии в градиентном круге -->
  <circle cx="256" cy="256" r="200" fill="url(#orangeGradient)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.2"/>
  
  <!-- Молния -->
  <path d="M 256 120 L 256 220 L 320 220 L 280 320 L 256 280 L 200 280 L 256 120 Z" 
        fill="#FFFFFF" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linejoin="round"/>
  
  <!-- Текст Leadspikers (опционально, можно убрать для более минималистичного варианта) -->
  <text x="256" y="380" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="48" 
        font-weight="800" 
        fill="#0A0A0A" 
        text-anchor="middle" 
        letter-spacing="-0.02em">Leadspikers</text>
</svg>
